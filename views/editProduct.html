<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <link href="/css/styles.css" rel="stylesheet">
        <link href="/css/personalizado.css" rel="stylesheet">
        <link rel="icon" href="/images/StepUpLogo.png">
        <title>Editar zapatilla</title>
         <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    </head>
    <body>
 <!-- Navigation-->
    {{> header}}
<section class="py-5">
    <div class="container px-4 px-lg-5">

        <div class="formulario-zapatilla p-4 p-md-5">
            <h2 class="text-center mb-4">Editar zapatilla</h2>

            
                    
<form action="/shoe/{{shoe._id}}/edit" method="POST" enctype="multipart/form-data">

    <div class="row g-3">

        <!-- ID -->
        <div class="col-12 col-md-6">
            <label for="id-zapatilla" class="form-label">
                ID de la zapatilla:
            </label>
            <input type="number" class="form-control"
                   id="id-zapatilla" name="Id_Zapatilla"
                   value="{{shoe.shoeId}}"
                   min="1" step="1" required>
        </div>

        <!-- Name -->
        <div class="col-12 col-md-6">
            <label for="nombre" class="form-label">
                Nombre:
            </label>
            <input type="text" class="form-control"
                   id="nombre" name="Name"
                   value="{{shoe.name}}" required>
        </div>

        <!-- Brand -->
        <div class="col-12 col-md-6">
            <label for="marca" class="form-label">
                Marca:
            </label>
            <input type="text" class="form-control"
                   id="marca" name="Brand"
                   value="{{shoe.brand}}" required>
        </div>

        <!-- Price -->
        <div class="col-12 col-md-6">
            <label for="precio" class="form-label">
                Precio (€):
            </label>
            <input type="number" class="form-control"
                   id="precio" name="Price"
                   value="{{shoe.price}}"
                   min="0" step="0.01" required>
        </div>

        <!-- Sizes -->
        <div class="col-12 col-md-6">
            <label class="form-label">
                Tallas:
            </label>

            <div class="tallas-botones">
                <button type="button" class="btn-talla" data-talla="38">38</button>
                <button type="button" class="btn-talla" data-talla="39">39</button>
                <button type="button" class="btn-talla" data-talla="40">40</button>
                <button type="button" class="btn-talla" data-talla="41">41</button>
                <button type="button" class="btn-talla" data-talla="42">42</button>
                <button type="button" class="btn-talla" data-talla="43">43</button>
                <button type="button" class="btn-talla" data-talla="44">44</button>
                <button type="button" class="btn-talla" data-talla="45">45</button>
                <button type="button" class="btn-talla" data-talla="46">46</button>
            </div>

            <input type="hidden"
             id="talla-seleccionada"
             name="Size"
            value="{{shoe.sizes}}">

            <small class="text-muted">
                Tallas seleccionadas:
                <span id="mostrar-talla" class="fw-bold text-dark">
                    Ninguna
                </span>
            </small>
        </div>

        <!-- Colour -->
        <div class="col-12 col-md-6">
            <label for="color" class="form-label">
                Color:
            </label>
            <input type="text" class="form-control"
                   id="color" name="Colour"
                   value="{{shoe.colour}}" required>
        </div>

        <!-- Sport -->
        <div class="col-12 col-md-6">
            <label for="deporte" class="form-label">
                Deporte:
            </label>
            <select class="form-select" id="deporte" name="Sport" required>
                {{#sports}}
                     <option value="{{value}}" {{#selected}}selected{{/selected}}>
               {{value}}
                    </option>
             {{/sports}}
            </select>
        </div>

        <!-- Stock -->
        <div class="col-12 col-md-6">
            <label for="stock" class="form-label">
                Stock:
            </label>
            <input type="number" class="form-control"
                   id="stock" name="Stock"
                   value="{{shoe.stock}}"
                   min="0" step="1" required>
        </div>

        <!-- Description -->
        <div class="col-12">
            <label for="descripcion" class="form-label">
                Descripción:
            </label>
            <textarea class="form-control"
                      id="descripcion" name="Description"
                      rows="4" required>{{shoe.description}}</textarea>
        </div>

        <!-- Main photo -->
        <div class="col-12">
            <label for="foto" class="form-label">
                Cambiar foto principal (opcional):
            </label>

            <input type="file" class="form-control"
                   id="foto" name="Photo"
                   accept="image/*">

            <small class="text-muted">
                Si no seleccionas otra fotografía, se conservará la actual.
            </small>
        </div>

        <!-- Additional photos -->
        <div class="col-12">
            <label for="otras-fotos" class="form-label">
                Nuevas fotos adicionales (opcional):
            </label>

            <input type="file" class="form-control"
                   id="otras-fotos" name="AdditionalPhotos"
                   accept="image/*" multiple>
        </div>

        <!-- Buttons -->
        <div class="col-12 text-center mt-4">

            <button type="submit" class="btn btn-success">
                Guardar cambios
            </button>

            <button type="reset" class="btn btn-outline-secondary">
                Restablecer
            </button>

            <a href="/shoe/{{shoe._id}}"
               class="btn btn-outline-secondary">
                Cancelar
            </a>

        </div>

    </div>
</form>

        </div>

    </div>
</section>
 <!-- Footer-->
      {{> footer}}
    </body>
</html>
