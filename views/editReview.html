<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/personalizado.css" rel="stylesheet">
    <link rel="icon" href="/images/StepUpLogo.png">
    <title>Editar reseña - STEP-UP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body>
    {{> header}}

    <section class="py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="form-container p-4 p-md-5 shadow-sm">
                <h2 class="mb-4 text-center">Editar reseña</h2>
                <form action="/shoe/{{shoeId}}/review/{{review._id}}/edit" method="POST">
                    <div class="mb-3">
                        <label for="user" class="form-label fw-bold">Nombre de usuario</label>
                        <input type="text" class="form-control" id="user" name="user" value="{{review.user}}" required minlength="2" maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label fw-bold">Fecha</label>
                        <input type="date" class="form-control" id="date" name="date" value="{{review.date}}" required>
                    </div>
                    <div class="mb-3">
                        <label for="rating" class="form-label fw-bold">Valoración (1 a 5)</label>
                        <input type="number" class="form-control" id="rating" name="rating" value="{{review.rating}}" min="1" max="5" required>
                    </div>
                    <div class="mb-4">
                        <label for="text" class="form-label fw-bold">Comentario</label>
                        <textarea class="form-control" id="text" name="text" rows="4" required minlength="5" maxlength="300">{{review.text}}</textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="/shoe/{{shoeId}}" class="btn btn-outline-dark">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    {{> footer}}
</body>
</html>
