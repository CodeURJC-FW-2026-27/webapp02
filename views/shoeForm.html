
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/personalizado.css" rel="stylesheet">
    <link rel="icon" href="/images/StepUpLogo.png">
    <title>{{formTitle}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
</head>

<body>
    {{> header}}

    <section class="py-5">
        <div class="container px-4 px-lg-5">
            <div class="form-container p-4 p-md-5">

                <h2 class="text-center mb-4">{{formTitle}}</h2>

                <form id="shoe-form" action="{{action}}" method="POST" enctype="multipart/form-data">

                    <div class="row g-3">

                        <!-- ID -->
                        <div class="col-12 col-md-6">
                            <label for="shoeId" class="form-label">ID de la zapatilla:</label>
                            <input type="number" class="form-control"
                                   id="shoeId" name="shoeId"
                                   value="{{shoe.shoeId}}"
                                   min="1" step="1" required>
                        </div>

                        <!-- Name -->
                        <div class="col-12 col-md-6">
                            <label for="name" class="form-label">Nombre:</label>
                            <input type="text" class="form-control"
                                   id="name" name="name"
                                   value="{{shoe.name}}"
                                   placeholder="Ej.: Pegasus 41"
                                   required pattern="^[A-ZÁÉÍÓÚÜÑ].*"
                                   title="Debe empezar por mayúscula">
                        </div>

                        <!-- Brand -->
                        <div class="col-12 col-md-6">
                            <label for="brand" class="form-label">Marca:</label>
                            <input type="text" class="form-control"
                                   id="brand" name="brand"
                                   value="{{shoe.brand}}"
                                   placeholder="Ej.: Nike" required>
                        </div>

                        <!-- Price -->
                        <div class="col-12 col-md-6">
                            <label for="price" class="form-label">Precio (€):</label>
                            <input type="number" class="form-control"
                                   id="price" name="price"
                                   value="{{shoe.price}}"
                                   min="1" max="5000" step="0.01" required>
                        </div>

                        <!-- Sizes -->
                        <div class="col-12 col-md-6">
                            <label for="sizes" class="form-label">Tallas:</label>

                            <div class="size-buttons">
                                <button type="button" class="btn-size" data-size="38">38</button>
                                <button type="button" class="btn-size" data-size="39">39</button>
                                <button type="button" class="btn-size" data-size="40">40</button>
                                <button type="button" class="btn-size" data-size="41">41</button>
                                <button type="button" class="btn-size" data-size="42">42</button>
                                <button type="button" class="btn-size" data-size="43">43</button>
                                <button type="button" class="btn-size" data-size="44">44</button>
                                <button type="button" class="btn-size" data-size="45">45</button>
                                <button type="button" class="btn-size" data-size="46">46</button>
                            </div>

                            <input type="hidden" id="selected-sizes"
                                   name="sizes" value="{{shoe.sizesString}}">

                            <small class="text-muted">
                                Tallas seleccionadas:
                                <span id="show-size" class="fw-bold text-dark">{{shoe.sizesString}}</span>
                            </small>
                        </div>

                        <!-- Colour -->
                        <div class="col-12 col-md-6">
                            <label for="colour" class="form-label">Color:</label>
                            <input type="text" class="form-control"
                                   id="colour" name="colour"
                                   value="{{shoe.colour}}"
                                   placeholder="Ej.: Blanco y verde" required>
                        </div>

                        <!-- Sport -->
                        <div class="col-12 col-md-6">
                            <label for="sport" class="form-label">Deporte:</label>
                            <select class="form-select" id="sport" name="sport" required>
                            <option value="">Selecciona un deporte</option>
                             <option value="Fútbol" {{#isFootball}}selected{{/isFootball}}>Fútbol</option>
                             <option value="Baloncesto" {{#isBasketball}}selected{{/isBasketball}}>Baloncesto</option>
                             <option value="Running" {{#isRunning}}selected{{/isRunning}}>Running</option>
                            </select>
                        </div>

                        <!-- Stock -->
                        <div class="col-12 col-md-6">
                            <label for="stock" class="form-label">Stock:</label>
                            <input type="number" class="form-control"
                                   id="stock" name="stock"
                                   value="{{shoe.stock}}"
                                   min="0" max="10000" step="1" required>
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <label for="description" class="form-label">Descripción:</label>
                            <textarea class="form-control"
                                      id="description" name="description"
                                      rows="4" required minlength="10"
                                      maxlength="500">{{shoe.description}}</textarea>
                        </div>
                        
                        <!-- Main photo -->
                        <div class="col-12">
                            <label for="image" class="form-label">Foto principal:</label>
                            {{#shoe.imageFilename}}
                            <div class="mb-2">
                                <p class="small text-muted mb-1">Imagen actual:</p>
                                <img src="/uploads/{{shoe.imageFilename}}"
                                     alt="{{shoe.name}}"
                                     class="img-thumbnail"
                                     style="max-height: 160px;">
                            </div>
                            {{/shoe.imageFilename}}
                            <input type="file" class="form-control"
                                   id="image" name="image"
                                   accept="image/*" {{#isNew}}required{{/isNew}}>
                            {{^isNew}}
                            <small class="text-muted">Si no seleccionas una nueva imagen, se mantendrá la actual.</small>
                            {{/isNew}}
                        </div>

                        <!-- Buttons -->
                        <div class="col-12 text-center mt-4">
                            <button type="submit" class="btn btn-success">Guardar</button>
                            

                            <a href="{{cancelUrl}}" class="btn btn-outline-dark">
                                Cancelar
                            </a>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </section>

    {{> footer}}
</body>
</html>
