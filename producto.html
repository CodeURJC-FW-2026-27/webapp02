<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoe details</title>
  <!--Bootstrap 5 styles-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!--Custom CSS file-->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!--Main container centered on the page-->
  <main class="container py-5">
    <!--Row with align-items-center so the text is vertically centered with the image-->
    <div class="row align-items-center">
      <!--Left Column: Image and back button-->
      <div class="col-12 col-md-6 text-center text-md-start mb-4 mb-md-0">
        <!--Product image-->
        <img src="images/MercurialSuperfly10.jpg"
             class="img-fluid rounded mb-4"
             alt="Mercurial Superfly 10">     
        <!--Container to position the button underneath-->
        <div>
          <!--Link to go back to the home page-->
          <a href="index.html" class="btn btn-outline-dark">Volver</a>
        </div>
      </div>

      <!--Right Column: Title, information and review button-->
      <div class="col-12 col-md-6">
        <h1 class="display-5 fw-bold mb-3">Mercurial Superfly 10</h1>
        
        <!--Product description-->
        <p class="lead mb-4">
          Esta zapatilla es espectacular porque cuenta con una unidad de amortiguación específica que aporta una sensación de propulsión adicional, además de una textura adherente para un control total del balón.
        </p>   
        <!--Button to add reviews-->
        <button type="button" class="btn btn-primary">Añadir reseña</button>
      </div>
    </div>
  </main>
</body>
</html>
