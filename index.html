<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEP-UP</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="text-center my-4">
        <h1>Bienvenido a STEP-UP!!</h1>
        <h2>Tu web para comprarte las mejores zapatillas a los mejores precios posibles!!</h2>
    </header>

    <main class="container my-5">
        <div class="row g-4">

            <!-- Zapatilla 1 -->
            <div class="col-12 col-sm-6 col-lg-4"> 
                <article class="sneaker-card">
                    <img src="images/MercurialSuperfly10.jpg" class="sneaker-img" alt="Mercurial Superfly 10">
                    <div class="p-3"> 
                        <span class="sneaker-brand">Nike</span>
                        <h3 class="sneaker-title">Mercurial Superfly 10</h3>                        
                        <p class="sneaker-price">279,99 €</p>
                        <a href="producto.html" class="btn btn-outline-dark btn-sm">Ver detalles</a>
                    </div>
                </article>
            </div>

            <!-- Zapatilla 2 -->
            <div class="col-12 col-sm-6 col-lg-4"> 
                <article class="sneaker-card">
                    <img src="images/Predator Elite FG.jpg" class="sneaker-img" alt="Predator Elite FG">
                    <div class="p-3"> 
                        <span class="sneaker-brand">Adidas</span>
                        <h3 class="sneaker-title">Predator Elite FG</h3>                        
                        <p class="sneaker-price">259,99 €</p>
                        <a href="producto.html" class="btn btn-outline-dark btn-sm">Ver detalles</a>
                    </div>
                </article>
            </div>
            
        </div> 
    </main> 

</body>
</html>
